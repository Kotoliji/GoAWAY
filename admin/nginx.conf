server {
  listen 80;
  root /usr/share/nginx/html;

  # client-side routes (/drivers, /live, ...) all serve the SPA
  location / {
    try_files $uri /index.html;
  }

  # hashed bundles can be cached for good
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
