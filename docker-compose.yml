# One-command local stack: Oracle XE (schema auto-built on first start), API
# and the admin panel.
#   docker compose up -d --build
#   API http://localhost:3000 · admin http://localhost:8080 (admin@tvdept.pt / demo123)
# First start builds the database (~1-3 min); later starts reuse the volume.
# Reset everything: docker compose down -v

services:
  db:
    image: gvenzl/oracle-xe:21-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle          # SYS/SYSTEM password (local only)
      APP_USER: tvdept                 # created in XEPDB1 with CREATE VIEW etc.
      APP_USER_PASSWORD: tvdept
    ports:
      - "1521:1521"
    volumes:
      - oradata:/opt/oracle/oradata
      - ./database:/opt/tvdept:ro
      - ./docker/db-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy only once install.sql has finished (marker written by db-init).
      test: ["CMD-SHELL", "test -f /opt/oracle/oradata/.tvdept_installed && healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  api:
    build: ./api
    environment:
      PORT: 3000
      DB_USER: tvdept
      DB_PASSWORD: tvdept
      DB_CONNECT_STRING: db:1521/XEPDB1
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  oradata:
